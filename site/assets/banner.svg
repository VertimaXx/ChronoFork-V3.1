    <radialGradient id="glow"><stop stop-color="#2677bd" stop-opacity=".35"/><stop offset="1" stop-color="#2677bd" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b3d5f4" stroke-opacity=".07"/></pattern>
    <clipPath id="clip"><rect width="1280" height="440" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
